<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Stick Clash</title>
<meta name="description" content="Wobbly physics stickman duels with floppy weapons, skills and power-ups.">
<!-- Home-screen app on iOS/Android: full screen, dark status bar, our name; the icons are inlined by build.mjs. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stick Clash">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080f">
<!--ICONS-->
<!--STYLE-->
</head>
<body>
<!-- The arena is one full-bleed canvas. Every menu, pause and results panel is built by 95-ui.js inside #ui. -->
<canvas id="c" aria-label="Stick Clash arena"></canvas>
<div id="ui"></div>
<!-- Touch controls (90-input shows them in play on a coarse pointer; 91-touch: stick, swipes, button arc). -->
<div id="touch" hidden>
  <div class="tzone tzone-l"><div class="tstick"><i></i></div></div>
  <div class="tzone tzone-r"></div>
  <div class="tarc">
    <button data-act="attack" class="big" aria-label="Attack">&#9876;</button>
    <button data-act="jump" class="big" aria-label="Jump">&#9650;</button>
    <button data-act="skill1" aria-label="Skill 1">S1</button>
    <button data-act="skill2" aria-label="Skill 2">S2</button>
    <button data-act="block" aria-label="Block (hold)">&#9670;</button>
    <button data-act="dash" aria-label="Dash">&raquo;</button>
    <button data-act="super" class="small" aria-label="Super">&#9733;</button>
    <button data-act="throw" class="small" aria-label="Throwable">&#9679;</button>
    <button data-act="grab" class="small" aria-label="Grab or throw">&#9995;</button>
    <button data-act="taunt" class="small" aria-label="Taunt">&#9996;</button>
  </div>
  <button data-act="pause" class="tpause" aria-label="Pause">II</button>
</div>
<!-- Portrait phones: the 16:9 arena would be a thin strip, so 90-input.js asks the player to turn the device. -->
<div id="rotate" hidden>
  <div class="rotate-card">
    <div class="rotate-phone" aria-hidden="true"></div>
    <h2>Turn your device sideways</h2>
    <p>The arena is wide: landscape gives you a much bigger view. The fight is paused.</p>
    <button type="button" class="rotate-skip">Play in portrait anyway</button>
  </div>
</div>
<!--SCRIPT-->
</body>
</html>
